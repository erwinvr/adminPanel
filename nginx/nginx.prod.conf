# nginx.prod.conf
#
# Variante de producción: fuerza HTTPS. Espera los certificados montados
# en /etc/nginx/certs (ver docker-compose.prod.yml). Reemplazar
# fullchain.pem/privkey.pem por los certificados reales de tu CA interna
# antes de desplegar.

server {
    listen 80;
    server_name _;
    # Redirección permanente de HTTP a HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Frontend estático (build de Vite, horneado en la imagen por
    # frontend/Dockerfile).
    root /usr/share/nginx/html;
    index index.html;

    # Compresión: las listas grandes (JSON) y el bundle (JS/CSS) viajan
    # 5-10 veces más chicos. Las imágenes ya vienen comprimidas.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # SPA fallback: el router usa HashRouter (#/usuarios, etc.), así que
    # en la práctica esto solo aplica a la carga inicial de "/".
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;

        # Las sincronizaciones manuales (ej. M365 con miles de usuarios) pueden
        # tardar más que los 60s por defecto — sin esto el botón muestra 504
        # aunque el backend termine bien.
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;
}
