# nginx.prod.conf
#
# Variante de producción: fuerza HTTPS. Espera los certificados montados
# en /etc/nginx/certs (ver docker-compose.prod.yml). Reemplazar
# fullchain.pem/privkey.pem por los certificados reales de tu CA interna
# antes de desplegar.

server {
    listen 80;
    server_name _;
    # Redirección permanente de HTTP a HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html/public;
    index index.html;

    location /src/ {
        alias /usr/share/nginx/html/src/;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;
}
