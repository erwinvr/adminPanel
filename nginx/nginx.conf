# nginx.conf
#
# Sirve el frontend estático (JS vanilla, sin build step) y actúa como
# reverse proxy hacia el backend Node para todo lo que empiece con /api.
# El backend NUNCA se expone directamente al exterior — ni en dev ni en
# producción — solo a través de este proxy.

server {
    listen 80;
    server_name _;

    # --- Frontend estático ---
    root /usr/share/nginx/html/public;
    index index.html;

    # Archivos fuente ES modules (frontend/src) servidos aparte de public/,
    # referenciados como /src/... en index.html.
    location /src/ {
        alias /usr/share/nginx/html/src/;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: cualquier ruta de navegación que no sea un archivo
    # real cae en index.html (útil cuando se agregue un router en Fase 8).
    location / {
        try_files $uri /index.html;
    }

    # --- Proxy hacia el backend ---
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;

        # Preserva el host/IP original del cliente — el backend confía en
        # estos headers porque tiene `trust proxy` habilitado y este nginx
        # es el único punto de entrada (no hay otro proxy delante).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las cookies de sesión deben viajar sin modificaciones.
        proxy_pass_header Set-Cookie;
    }

    # Cabeceras de seguridad adicionales a nivel de proxy (complementan,
    # no reemplazan, a Helmet en el backend).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;
}
